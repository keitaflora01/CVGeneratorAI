<nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
  <div class="flex justify-between items-center h-16">
    <!-- Logo Section -->
    <div class="flex items-center gap-3">
      <div class="p-2 bg-gradient-to-r from-blue-600 to-purple-600 rounded-lg">
        <div class="w-10 h-10 bg-gradient-to-r from-primary-500 to-secondary-500 rounded-lg flex items-center justify-center">
              <i class="fas fa-robot text-white text-lg"></i>
        </div>
      </div>
       <!-- Logo -->
      <div class="flex items-center space-x-2">
         
          <span class="text-2xl font-bold gradient-text">CVBot</span>
      </div>
    </div>

    <!-- Navigation and User Section -->
    <div class="flex items-center space-x-4">
      <!-- Navigation Links -->
      <div class="flex space-x-2">
        <a href="{% url 'Agent:template_selection' %}" class="px-4 py-2 rounded-lg font-medium {% if request.path == '/templates/' %}bg-blue-100 text-blue-700{% else %}text-gray-600 hover:text-gray-900 hover:bg-gray-100{% endif %}">Templates</a>
        <a href="{% url 'comptes:dashboard' %}" class="px-4 py-2 rounded-lg font-medium {% if request.path == '/dashboard/' %}bg-blue-100 text-blue-700{% else %}text-gray-600 hover:text-gray-900 hover:bg-gray-100{% endif %}">Dashboard</a>
        <a href="{% url 'comptes:generate' %}" class="px-4 py-2 rounded-lg font-medium {% if request.path == '/generate/' %}bg-blue-100 text-blue-700{% else %}text-gray-600 hover:text-gray-900 hover:bg-gray-100{% endif %}">Générateur</a>
      </div>

      <!-- User Dropdown -->
      {% if request.user.is_authenticated %}
      <div class="relative">
        <button class="flex items-center space-x-2 px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 focus:ring-2 focus:ring-blue-500" onclick="toggleUserDropdown()">
          <i class="fas fa-user"></i>
          <span>{{ request.user.full_name|default:request.user.email }}</span>
          <i class="fas fa-chevron-down text-xs transition-transform duration-300" id="userDropdownChevron"></i>
        </button>
        <div id="userDropdown" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-2 z-50">
          <a href="{% url 'comptes:account_settings' %}" class="flex items-center px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-100 transition-colors">
            <i class="fas fa-cog mr-3 w-5 text-gray-500"></i>
            Account Settings
          </a>
          <hr class="my-2 border-gray-200">
          <form method="post" action="{% url 'comptes:logout' %}">
            {% csrf_token %}
            <button type="submit" class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 transition-colors">
              <i class="fas fa-sign-out-alt mr-2"></i>Déconnexion
            </button>
          </form>
        </div>
      </div>
      {% endif %}
    </div>
  </div>
</nav>

<script>
  function toggleUserDropdown() {
    const dropdown = document.getElementById('userDropdown');
    const chevron = document.getElementById('userDropdownChevron');
    
    if (dropdown.classList.contains('hidden')) {
      dropdown.classList.remove('hidden');
      setTimeout(() => {
        dropdown.classList.add('opacity-100', 'translate-y-0');
        dropdown.classList.remove('opacity-0', 'translate-y-2');
      }, 10);
      chevron.style.transform = 'rotate(180deg)';
    } else {
      dropdown.classList.add('opacity-0', 'translate-y-2');
      dropdown.classList.remove('opacity-100', 'translate-y-0');
      setTimeout(() => {
        dropdown.classList.add('hidden');
      }, 300);
      chevron.style.transform = 'rotate(0deg)';
    }
  }

  document.addEventListener('click', function(event) {
    const dropdown = document.getElementById('userDropdown');
    const button = event.target.closest('button[onclick="toggleUserDropdown()"]');
    
    if (dropdown && !dropdown.contains(event.target) && !button) {
      if (!dropdown.classList.contains('hidden')) {
        toggleUserDropdown();
      }
    }
  });
</script>
